version: '3'

dotenv: ['.env']

tasks:
  install:
    desc: Install Python dependencies with uv (Python 3.10+)
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/pyvenv.cfg
    cmds:
      - uv sync --locked

  env:
    desc: Copy .env.example to .env if .env doesn't exist
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env from .env.example — edit it and set THREE_API_KEY, USE_CASE_SLUG and at least one provider key"

  typecheck:
    desc: Type-check the example (mypy --strict)
    deps: [install]
    cmds:
      - uv run --locked mypy

  run:
    desc: Run one conversation per configured provider through the three.dev gateway
    deps: [install, env]
    cmds:
      - uv run --locked src/main.py

  default:
    desc: Install everything and run
    cmds:
      - task: run
